version: '3.8'

services:
  flagura:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: flagura-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://postgres:flagurasecret@postgres:5432/flagura?sslmode=disable
      - APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: flagura-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=flagurasecret
      - POSTGRES_DB=flagura
    volumes:
      - flagura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flagura"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional monitoring stack (start with: docker compose --profile monitoring up)
  prometheus:
    image: prom/prometheus:latest
    container_name: flagura-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - flagura
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: flagura-grafana
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  flagura_pgdata:

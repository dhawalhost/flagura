name: Publish SDKs (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Target SDK to publish'
        required: true
        default: 'javascript'
        type: choice
        options:
          - 'javascript'
          - 'python'
          - 'rust'
          - 'go'
          - 'all'
      version:
        description: 'Semantic Version to publish (e.g. 1.0.0 or 1.5.0)'
        required: true
        default: '1.0.0'
        type: string
      dry_run:
        description: 'Dry run (validate build and packaging without publishing to registries)'
        required: true
        default: false
        type: boolean

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: 🛡️ Authorize Publisher
    runs-on: ubuntu-latest
    steps:
      - name: Verify Authorized Actor
        run: |
          echo "Workflow triggered by: ${{ github.actor }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ] && [ "${{ github.actor }}" != "dhawalhost" ]; then
            echo "::error::Access Denied: User '${{ github.actor }}' is not authorized to publish Flagura SDKs. Only '${{ github.repository_owner }}' is permitted."
            exit 1
          fi
          echo "✅ Authorization confirmed for '${{ github.actor }}'."

  publish-javascript:
    name: 📦 Publish JavaScript/TypeScript SDK (NPM)
    needs: authorize
    if: ${{ github.event.inputs.language == 'javascript' || github.event.inputs.language == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Sync Version in package.json
        working-directory: sdks/js
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${TARGET_VERSION#v}"
          npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies & Build Bundle
        working-directory: sdks/js
        run: |
          npm install
          npm run build

      - name: Publish to NPM (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: sdks/js
        run: |
          echo "⚡ Running dry-run publish for @flagura/sdk..."
          npm publish --access public --dry-run

      - name: Publish to NPM Registry
        if: ${{ github.event.inputs.dry_run == 'false' }}
        working-directory: sdks/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing secret NPM_TOKEN in repository secrets."
            exit 1
          fi
          npm publish --access public

  publish-python:
    name: 🐍 Publish Python SDK (PyPI)
    needs: authorize
    if: ${{ github.event.inputs.language == 'python' || github.event.inputs.language == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build & Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest

      - name: Sync Version in pyproject.toml
        working-directory: sdks/python
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${TARGET_VERSION#v}"
          sed -i 's/^version = .*/version = "'"$CLEAN_VERSION"'"/' pyproject.toml

      - name: Run Test Suite
        working-directory: sdks/python
        run: |
          pytest test_client.py

      - name: Build Wheel and Source Distribution
        working-directory: sdks/python
        run: |
          python -m build

      - name: Check Package Artifacts with Twine
        working-directory: sdks/python
        run: |
          twine check dist/*

      - name: Upload to PyPI (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "⚡ Dry-run mode: Wheel and source distributions verified successfully without publishing."

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run == 'false' }}
        working-directory: sdks/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::Missing secret PYPI_API_TOKEN in repository secrets."
            exit 1
          fi
          twine upload dist/*

  publish-rust:
    name: 🦀 Publish Rust SDK (Crates.io)
    needs: authorize
    if: ${{ github.event.inputs.language == 'rust' || github.event.inputs.language == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Version in Cargo.toml
        working-directory: sdks/rust
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${TARGET_VERSION#v}"
          sed -i 's/^version = .*/version = "'"$CLEAN_VERSION"'"/' Cargo.toml

      - name: Run Cargo Test
        working-directory: sdks/rust
        run: |
          cargo test

      - name: Publish to Crates.io (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: sdks/rust
        run: |
          echo "⚡ Running cargo publish --dry-run..."
          cargo publish --dry-run

      - name: Publish to Crates.io
        if: ${{ github.event.inputs.dry_run == 'false' }}
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Missing secret CRATES_IO_TOKEN in repository secrets."
            exit 1
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

  publish-go:
    name: 🐹 Publish Go SDK (Go Module Proxy)
    needs: authorize
    if: ${{ github.event.inputs.language == 'go' || github.event.inputs.language == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History for Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go SDK Tests
        working-directory: sdks/go
        run: |
          go test -v -race ./...

      - name: Create and Push Submodule Tag
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          TAG_NAME="sdks/go/v${CLEAN_VERSION}"

          echo "Target tag: $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping tag creation."
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "✅ Tag $TAG_NAME pushed to repository."
          fi

          echo "Pinging proxy.golang.org to index $TAG_NAME..."
          curl -s -f "https://proxy.golang.org/github.com/dhawalhost/flagura/sdks/go/@v/v${CLEAN_VERSION}.info" || true
          echo "✅ Go Module Proxy indexed."

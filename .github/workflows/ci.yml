name: CI & Security Guardrails

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 01:00 UTC (1:00 AM) to verify E2E and multi-SDK suite health
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, Test & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Templ Compiler
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Verify & Generate Templates
        run: templ generate

      - name: Go Vet & Lint Check
        run: go vet ./...

      - name: Run Unit Test Suite
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic $(go list ./... | grep -v /tests/e2e)

      - name: Run Go Vulnerability Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Gosec SAST Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=web/views ./...

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Compile Flagura Server & CLI Binaries
        run: |
          go build -v -o bin/flagura-server ./cmd/server
          go build -v -o bin/flagura ./cmd/cli

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.txt
          if-no-files-found: ignore

  e2e:
    name: 🧪 End-to-End Multi-SDK Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python SDK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openfeature-sdk
          pip install -e sdks/python

      - name: Install & Build TypeScript SDK and E2E Dependencies
        run: |
          npm --prefix sdks/js install
          npm --prefix sdks/js run build
          npm --prefix examples/typescript install

      - name: Install Templ Compiler & Generate Views
        run: |
          go install github.com/a-h/templ/cmd/templ@latest
          templ generate

      - name: Run Full End-to-End Test Suite
        run: |
          chmod +x scripts/test_e2e.sh
          ./scripts/test_e2e.sh

      - name: Alert on Scheduled Failure
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::error title=Daily E2E Failure::🚨 The scheduled 1 AM E2E & Multi-SDK verification suite failed on the default branch. Please review logs and resolve regressions."


name: CI & Security Guardrails

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build, Test & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Templ Compiler
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Verify & Generate Templates
        run: templ generate

      - name: Go Vet & Lint Check
        run: go vet ./...

      - name: Run Test Suite
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run Go Vulnerability Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Gosec SAST Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=web/views ./...

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Compile Flagura Binary
        run: go build -v -o bin/flagura main.go

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage.txt
          if-no-files-found: ignore

